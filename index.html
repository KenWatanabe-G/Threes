<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Threes! Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Threes!</h1>
            <p class="game-description">1と2を組み合わせて3を作り、3以降は同じ数字同士を組み合わせます</p>
            <div class="score-container">
                <div class="score">
                    <span class="score-label">スコア</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="best">
                    <span class="best-label">ベスト</span>
                    <span class="best-value" id="best">0</span>
                </div>
            </div>
        </div>

        <div class="game-info">
            <div class="button-group">
                <button id="new-game" class="new-game-button">New Game</button>
                <button id="undo-button" class="undo-button" disabled>Undo</button>
                <button id="delete-mode-button" class="delete-mode-button" title="マス削除モード">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M3 6h18v2H3V6zm2 3h2l1 11h8l1-11h2l-1.5 13H5.5L4 9zm7-5c1.1 0 2 .9 2 2h4v2H6V6h4c0-1.1.9-2 2-2zm0 2c-.6 0-1-.4-1-1h2c0 .6-.4 1-1 1z"/>
                        <rect x="10" y="10" width="4" height="8" rx="1"/>
                    </svg>
                </button>
                <button id="ai-toggle" class="ai-toggle-button" title="AI自動操作">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <rect x="7" y="3" width="10" height="14" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <circle cx="12" cy="7" r="1.5"/>
                        <circle cx="9" cy="11" r="1"/>
                        <circle cx="15" cy="11" r="1"/>
                        <path d="M9 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <rect x="9" y="18" width="2" height="3"/>
                        <rect x="13" y="18" width="2" height="3"/>
                        <circle cx="6" cy="10" r="1.5"/>
                        <circle cx="18" cy="10" r="1.5"/>
                    </svg>
                </button>
            </div>
            <div class="next-tile-preview">
                <span class="next-label">次のタイル:</span>
                <div id="next-tile" class="next-tile-display"></div>
            </div>
        </div>

        <div class="game-container">
            <div id="game-board" class="game-board">
                <!-- タイルはJavaScriptで生成 -->
            </div>
            <div id="ai-indicator" class="ai-indicator hidden">
                <span>🤖 AI操作中...</span>
            </div>
            <div id="game-over" class="game-over hidden">
                <h2>ゲームオーバー</h2>
                <p>最終スコア: <span id="final-score">0</span></p>
                <button id="restart-button" class="restart-button">もう一度</button>
            </div>
        </div>

        <div class="instructions">
            <p><strong>操作方法:</strong> 矢印キー ←↑→↓ またはスワイプでタイルを動かします</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
