<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Threes! Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Threes!</h1>
            <p class="game-description">1と2を組み合わせて3を作り、3以降は同じ数字同士を組み合わせます</p>
            <div class="score-container">
                <div class="score">
                    <span class="score-label">スコア</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="best">
                    <span class="best-label">ベスト</span>
                    <span class="best-value" id="best">0</span>
                </div>
            </div>
        </div>

        <div class="game-info">
            <div class="button-group">
                <button id="new-game" class="new-game-button">New Game</button>
                <button id="undo-button" class="undo-button" disabled title="元に戻す">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                    </svg>
                </button>
                <button id="delete-mode-button" class="delete-mode-button" title="マス削除モード">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M3 6h18v2H3V6zm2 3h2l1 11h8l1-11h2l-1.5 13H5.5L4 9zm7-5c1.1 0 2 .9 2 2h4v2H6V6h4c0-1.1.9-2 2-2zm0 2c-.6 0-1-.4-1-1h2c0 .6-.4 1-1 1z"/>
                        <rect x="10" y="10" width="4" height="8" rx="1"/>
                    </svg>
                </button>
                <button id="ai-toggle" class="ai-toggle-button" title="AI自動操作">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <rect x="7" y="3" width="10" height="14" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <circle cx="12" cy="7" r="1.5"/>
                        <circle cx="9" cy="11" r="1"/>
                        <circle cx="15" cy="11" r="1"/>
                        <path d="M9 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <rect x="9" y="18" width="2" height="3"/>
                        <rect x="13" y="18" width="2" height="3"/>
                        <circle cx="6" cy="10" r="1.5"/>
                        <circle cx="18" cy="10" r="1.5"/>
                    </svg>
                </button>
                <button id="ai-debug-toggle" class="ai-debug-button" title="AI分析パネル">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M3 3h18v4H3V3zm0 6h18v12H3V9zm2 2v8h14v-8H5z"/>
                        <rect x="7" y="12" width="3" height="1"/>
                        <rect x="7" y="14" width="5" height="1"/>
                        <rect x="7" y="16" width="4" height="1"/>
                    </svg>
                </button>
            </div>
            <div class="next-tile-preview">
                <span class="next-label">次のタイル:</span>
                <div id="next-tile" class="next-tile-display"></div>
            </div>
        </div>

        <div class="game-container">
            <div id="game-board" class="game-board">
                <!-- タイルはJavaScriptで生成 -->
            </div>
            <div id="ai-indicator" class="ai-indicator hidden">
                <span>🤖 AI操作中...</span>
            </div>
            <div id="game-over" class="game-over hidden">
                <h2>ゲームオーバー</h2>
                <p>最終スコア: <span id="final-score">0</span></p>
                <button id="restart-button" class="restart-button">もう一度</button>
            </div>
        </div>

        <div class="instructions">
            <p><strong>操作方法:</strong> 矢印キー ←↑→↓ またはスワイプでタイルを動かします</p>
        </div>
    </div>

    <!-- AI分析パネル -->
    <div id="ai-debug-panel" class="ai-debug-panel hidden">
        <div class="ai-debug-content">
            <div class="ai-debug-header">
                <h2>AI分析パネル</h2>
                <button id="ai-debug-close" class="close-button">×</button>
            </div>

            <div class="ai-debug-body">
                <!-- 最適手の表示 -->
                <div class="best-move-section">
                    <h3>推奨手: <span id="best-move-display">-</span></h3>
                    <p class="best-move-score">スコア: <span id="best-move-score">-</span></p>
                </div>

                <!-- 重み調整セクション -->
                <div class="weights-section">
                    <h3>評価重み調整</h3>
                    <div class="weight-controls">
                        <div class="weight-control">
                            <label>Openness (空きマス): <span id="w1-value">1000</span></label>
                            <input type="range" id="w1-slider" min="0" max="3000" step="100" value="1000">
                        </div>
                        <div class="weight-control">
                            <label>Monotonicity (蛇行配置): <span id="w2-value">800</span></label>
                            <input type="range" id="w2-slider" min="0" max="3000" step="100" value="800">
                        </div>
                        <div class="weight-control">
                            <label>Smoothness (滑らかさ): <span id="w3-value">1500</span></label>
                            <input type="range" id="w3-slider" min="0" max="3000" step="100" value="1500">
                        </div>
                        <div class="weight-control">
                            <label>Adjacency (1-2ペア): <span id="w4-value">600</span></label>
                            <input type="range" id="w4-slider" min="0" max="3000" step="100" value="600">
                        </div>
                        <div class="weight-control">
                            <label>Corner Integrity (コーナー): <span id="w5-value">3000</span></label>
                            <input type="range" id="w5-slider" min="0" max="5000" step="100" value="3000">
                        </div>
                        <button id="reset-weights" class="reset-button">デフォルトに戻す</button>
                    </div>
                </div>

                <!-- 各方向の評価スコアテーブル -->
                <div class="scores-section">
                    <h3>各方向の評価スコア</h3>
                    <div class="scores-table-container">
                        <table class="scores-table">
                            <thead>
                                <tr>
                                    <th>方向</th>
                                    <th>総合</th>
                                    <th>空きマス</th>
                                    <th>蛇行</th>
                                    <th>滑らか</th>
                                    <th>1-2ペア</th>
                                    <th>コーナー</th>
                                    <th>位置</th>
                                </tr>
                            </thead>
                            <tbody id="scores-table-body">
                                <!-- JavaScriptで動的に生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- クリップボードコピーボタン -->
    <button id="copy-board-button" class="copy-board-button" title="盤面をコピー">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <rect x="8" y="2" width="12" height="16" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <path d="M6 6H4v14c0 1.1.9 2 2 2h10v-2H6V6z"/>
        </svg>
    </button>

    <script src="ai.js"></script>
    <script src="game.js"></script>
</body>
</html>
